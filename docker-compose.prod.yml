# Production, Safe for work edition: https://acceptodds.com
#
# Its own compose project (`acceptodds-sfw`), images, Traefik router and
# database volume, beside the market edition's `acceptodds` project, which it
# never writes to. Its database is a copy of the market edition's with the
# trading data stripped out (scripts/strip-markets.sql), made once:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d postgres
#   docker start acceptodds-postgres-1           # the market edition's DB, only read
#   docker exec acceptodds-postgres-1 sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
#     | docker exec -i acceptodds-sfw-postgres-1 sh -c 'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner'
#   docker stop acceptodds-postgres-1
#   docker exec -i acceptodds-sfw-postgres-1 sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
#     < scripts/strip-markets.sql
#
# Then build and start `app` as below, and take the market edition's
# maintenance page down (it claims the same hosts at a higher priority).
#
# Production: https://acceptodds.com
#
# Runs behind the host's shared Traefik (~/proxy/docker-compose.yml), which owns
# :80/:443, admits only Cloudflare (cfonly@file) and serves the Cloudflare
# Origin CA certificate from its file provider. This file publishes no ports:
# `app` joins the external `web` network and is routed by its labels alone.
#
# One-time: scripts/init-env-production.sh https://acceptodds.com
#
# Deploy (commit first: the image is tagged with HEAD's commit, so a dirty tree
# would ship code no commit names):
#   test -z "$(git status --porcelain)" && export GIT_COMMIT=$(git rev-parse --short HEAD)
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile tools build
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d postgres
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm tools
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d app
#
# Migrations are their own step, never run at app start (src/db/migrate.ts).
# `build` needs --profile tools: without it the tools image goes stale and
# migrate silently applies nothing new.
# `tools` runs them by default; other scripts:
#   ... run --rm tools npm run token:mint -- --handle research-bot --scopes admin --name ops
#   ... run --rm tools npm run digest:send
#   ... run --rm -e SEED_ADMIN_PASSWORD=... tools npm run db:seed -- --allow-remote
#       (resets trading and users; preserves papers, related lists and map vectors)
#       Add --reset-listings only to also wipe paper data and reload SQLite.

name: acceptodds-sfw

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port: reachable only from app/tools on the default network.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: app
      # Also what GET /api/v1/version reports as `commit`.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    # One tag per commit (`docker ps` shows which is live); an older tag is the rollback.
    image: acceptodds-sfw-app:${GIT_COMMIT:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - web
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - acceptodds-sfw.commit=${GIT_COMMIT:-unknown}
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.acceptodds-sfw.rule=Host(`acceptodds.com`) || Host(`www.acceptodds.com`)
      - traefik.http.routers.acceptodds-sfw.entrypoints=websecure
      - traefik.http.routers.acceptodds-sfw.tls=true
      - traefik.http.routers.acceptodds-sfw.middlewares=acceptodds-sfw-www,acceptodds-sfw-headers,acceptodds-sfw-ratelimit
      - traefik.http.services.acceptodds-sfw.loadbalancer.server.port=3000
      # www -> apex, so Better Auth's single origin is the only one in use.
      - traefik.http.middlewares.acceptodds-sfw-www.redirectregex.regex=^https://www\.acceptodds\.com/(.*)
      - traefik.http.middlewares.acceptodds-sfw-www.redirectregex.replacement=https://acceptodds.com/$${1}
      - traefik.http.middlewares.acceptodds-sfw-www.redirectregex.permanent=true
      - traefik.http.middlewares.acceptodds-sfw-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.acceptodds-sfw-headers.headers.framedeny=true
      - traefik.http.middlewares.acceptodds-sfw-headers.headers.referrerpolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.acceptodds-sfw-headers.headers.stsseconds=31536000
      # Anonymous traffic is the edge's job (AGENTS.md); keyed on the real client
      # IP, which is trustworthy because only Cloudflare can reach this origin.
      - traefik.http.middlewares.acceptodds-sfw-ratelimit.ratelimit.average=${RATE_LIMIT_AVERAGE:-30}
      - traefik.http.middlewares.acceptodds-sfw-ratelimit.ratelimit.burst=${RATE_LIMIT_BURST:-60}
      - traefik.http.middlewares.acceptodds-sfw-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.acceptodds-sfw-ratelimit.ratelimit.sourcecriterion.requestheadername=Cf-Connecting-Ip

  tools:
    build:
      context: .
      target: tools
    image: acceptodds-sfw-tools
    profiles: [tools]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

networks:
  web:
    external: true
